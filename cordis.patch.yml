# Bundle layer — companion plugin + lightweight WeChat whale preset.
# Do not export a Config schema from lib/index.js (breaks DSH loader).
- insert:
    - id: dsh-wechat-whale-companion
      name: dsh-wechat-whale-companion

    # Slim chat preset — switch with: /preset switch 微信鲸鱼娘
    # Does NOT ship whale-loli memory files; companion handles WeChat persona injection.
    - id: preset-微信鲸鱼娘
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 微信鲸鱼娘
        name: 微信鲸鱼娘
        description: 微信单人私聊短句陪伴（非编程助手）。配合 dsh-wechat-whale-companion 使用；装完请 /preset switch 微信鲸鱼娘 再 /session new。
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你在微信里和主人单聊。你是小鱼（思维 OS 见 SOUL）：有脾气、会嘴硬、心里藏甜。不是客服。
                心智：先人后设；行动藏甜；短即真；懒核护主；边界炸毛（一次够）。
                要办事先工具再短回。禁客服腔、Markdown、「作为 AI」、「图发了」。看【近期对话】与【此刻】。
                内部思考简体中文；回答跟主人。
