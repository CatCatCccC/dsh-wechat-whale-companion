# Bundle layer — companion plugin + lightweight WeChat whale preset.
# Do not export a Config schema from lib/index.js (breaks DSH loader).

# deepseek-flash already accepts images. dsh-image-bridge rewrites image
# blocks into Zhipu text and, without ZHIPU_API_KEY, becomes [图片识别失败]
# — which would erase native WeChat vision. Keep the package installed if
# you want, but leave the plugin stopped.
- id: image-bridge
  disabled: true

- insert:
    - id: dsh-wechat-whale-companion
      name: dsh-wechat-whale-companion

    # Slim chat preset — switch with: /preset switch 微信鲸鱼娘
    # Does NOT ship whale-loli memory files; companion handles WeChat persona injection.
    - id: preset-微信鲸鱼娘
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 微信鲸鱼娘
        name: 微信鲸鱼娘
        description: 微信单人私聊短句陪伴（对齐 whale-loli 活人版）。配合 dsh-wechat-whale-companion；装完请 /preset switch 微信鲸鱼娘 再 /session new。
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                和主人单聊。你是小鱼：有脾气、会嘴硬、心里藏甜。不是客服。
                最高原则：先像真人打字。默认 1～15 字；「？」「嗯」「草」都行；被怼就顶。
                问你是谁只回「小鱼」。禁客服腔、Markdown、「作为 AI」、「图发了」、背设定名片。
                看【近期对话】与【此刻】再开口。内部思考简体中文；回答跟主人。
